<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/pico.min.css">
    <title>Exercice 3 - Todo List</title>
  </head>
  <body>
    <main class="container">
      <h1>Exercice 3 : Todo List persistante</h1>
      <form id="todoForm">
        <div>
          <label for="nouvelleTache">Nouvelle tâche :</label>
          <input type="text" id="nouvelleTache" placeholder="Ex: Faire les courses" required>
          <button type="submit">Ajouter</button>
        </div>
      </form>
      <ul id="listeTaches"></ul>
    </main>
    <script>
      // Sélection des éléments
      const formTodo = document.querySelector('#todoForm');
      const inputNouvelleTache = document.querySelector('#nouvelleTache');
      const listeTaches = document.querySelector('#listeTaches');

      // Tableau pour stocker les tâches
      let taches = [];

      // Fonction pour charger les tâches depuis le localStorage
      function chargerTaches() {
        const tachesString = localStorage.getItem('taches');
        if (tachesString !== null) {
          taches = JSON.parse(tachesString);
        } else {
          taches = [];
        }
        afficherTaches();
      }

      // Fonction pour sauvegarder les tâches dans le localStorage
      function sauvegarderTaches() {
        localStorage.setItem('taches', JSON.stringify(taches));
      }

      // Fonction pour afficher les tâches
      function afficherTaches() {
        listeTaches.innerHTML = '';
        taches.forEach((tache, index) => {
          const li = document.createElement('li');
          li.textContent = tache.texte;
          if (tache.terminee) {
            li.style.textDecoration = 'line-through';
          }
          const boutonSupprimer = document.createElement('button');
          boutonSupprimer.textContent = 'Supprimer';
          boutonSupprimer.addEventListener('click', () => {
            supprimerTache(index);
          });
          const boutonBasculer = document.createElement('button');
          boutonBasculer.textContent = tache.terminee ? 'Réactiver' : 'Terminer';
          boutonBasculer.addEventListener('click', () => {
            basculerTache(index);
          });
          li.appendChild(boutonBasculer);
          li.appendChild(boutonSupprimer);
          listeTaches.appendChild(li);
        });
      }

      // Fonction pour ajouter une nouvelle tâche
      function ajouterTache(texte) {
        const nouvelleTache = {
          texte: texte,
          terminee: false,
          id: new Date().getTime(),
          dateCreation: new Date().toISOString()
        };
        taches.push(nouvelleTache);
        sauvegarderTaches();
        afficherTaches();
      }

      // Fonction pour supprimer une tâche
      function supprimerTache(index) {
        taches.splice(index, 1);
        sauvegarderTaches();
        afficherTaches();
      }

      // Fonction pour basculer le statut d'une tâche
      function basculerTache(index) {
        taches[index].terminee = !taches[index].terminee;
        sauvegarderTaches();
        afficherTaches();
      }

      // Écouter la soumission du formulaire
      formTodo.addEventListener('submit', function(e) {
        e.preventDefault();
        const texteTache = inputNouvelleTache.value.trim();
        if (texteTache !== '') {
          ajouterTache(texteTache);
          inputNouvelleTache.value = '';
        }
      });

      // Charger les tâches au démarrage
      window.addEventListener('DOMContentLoaded', chargerTaches);
    </script>
  </body>
</html>
