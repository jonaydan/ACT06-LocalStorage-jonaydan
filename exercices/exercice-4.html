<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/pico.min.css">
    <title>Exercice 4 - Panier d'achat</title>
  </head>
  <body>
    <main class="container">
      <h1>Exercice 4 : Panier d'achat</h1>

      <!-- Liste des produits disponibles -->
      <section>
        <h2>Produits disponibles</h2>
        <div id="listeProduits">
          <!-- Les produits seront ajoutés ici dynamiquement -->
        </div>
      </section>

      <!-- Panier -->
      <section>
        <h2>Votre panier</h2>
        <ul id="panier"></ul>
        <p>Total : <span id="total">0.00 €</span></p>
      </section>
    </main>

    <script>
      // Liste des produits disponibles
const produitsDisponibles = [
  { id: 1, nom: "Pomme", prix: 0.50, emoji: "🍎" },
  { id: 2, nom: "Banane", prix: 0.30, emoji: "🍌" },
  { id: 3, nom: "Pain", prix: 1.20, emoji: "🍞" },
  { id: 4, nom: "Lait", prix: 0.80, emoji: "🥛" },
];

      // Sélection des éléments du DOM
const listeProduits = document.querySelector('#listeProduits');
const panier = document.querySelector('#panier');
const totalSpan = document.querySelector('#total');

// Panier (initialement vide)
let panierUtilisateur = [];

// Fonction pour afficher les produits disponibles
function afficherProduits() {
  produitsDisponibles.forEach(produit => {
    const divProduit = document.createElement('div');
    divProduit.style.marginBottom = '1rem';
    divProduit.style.padding = '1rem';
    divProduit.style.border = '1px solid #ddd';
    divProduit.style.borderRadius = '8px';
    divProduit.innerHTML = `
      <h3 style="font-size: 3rem; margin: 0;">${produit.emoji}</h3>
      <p style="margin: 0.5rem 0;"><strong>${produit.nom}</strong></p>
      <p style="margin: 0.5rem 0; color: #0172ad; font-weight: bold;">${produit.prix.toFixed(2)} €</p>
      <button data-id="${produit.id}">Ajouter au panier</button>
    `;
    listeProduits.appendChild(divProduit);
  });

  // Écouter les clics sur les boutons "Ajouter au panier"
  document.querySelectorAll('#listeProduits button').forEach(bouton => {
    bouton.addEventListener('click', (e) => {
      const idProduit = parseInt(e.target.getAttribute('data-id'));
      ajouterAuPanier(idProduit);
    });
  });
}
// Fonction pour charger le panier depuis le localStorage
function chargerPanier() {
  const panierString = localStorage.getItem('panier');
  if (panierString !== null) {
    panierUtilisateur = JSON.parse(panierString);
  } else {
    panierUtilisateur = [];
  }
  afficherPanier();
}
// Fonction pour sauvegarder le panier dans le localStorage
function sauvegarderPanier() {
  localStorage.setItem('panier', JSON.stringify(panierUtilisateur));
}
// Fonction pour ajouter un produit au panier
function ajouterAuPanier(idProduit) {
  const produit = produitsDisponibles.find(p => p.id === idProduit);
  if (!produit) return; // Si le produit n'existe pas, on quitte

  // Vérifier si le produit est déjà dans le panier
  const produitDansPanier = panierUtilisateur.find(item => item.id === idProduit);

  if (produitDansPanier) {
    // Si le produit est déjà dans le panier, on incrémente la quantité
    produitDansPanier.quantity += 1;
  } else {
    // Sinon, on l'ajoute avec une quantité de 1
    panierUtilisateur.push({
      id: produit.id,
      nom: produit.nom,
      prix: produit.prix,
      emoji: produit.emoji,
      quantity: 1
    });
  }

  sauvegarderPanier();
  afficherPanier();
}
// Fonction pour afficher le panier
function afficherPanier() {
  // Vider le panier actuel
  panier.innerHTML = '';

  // Si le panier est vide, afficher un message
  if (panierUtilisateur.length === 0) {
    panier.innerHTML = '<li style="list-style: none; color: #888;">🛒 Votre panier est vide</li>';
    totalSpan.textContent = '0.00 €';
    return;
  }

  // Calculer le total
  let total = 0;

  // Parcourir les éléments du panier
  panierUtilisateur.forEach((item, index) => {
    const li = document.createElement('li');
    const prixTotalItem = item.prix * item.quantity;
    total += prixTotalItem;

    li.innerHTML = `
      <span style="font-size: 1.5rem;">${item.emoji || '📦'}</span>
      <strong>${item.nom}</strong> - ${item.prix.toFixed(2)} € x ${item.quantity} =
      <strong>${prixTotalItem.toFixed(2)} €</strong>
      <button data-index="${index}" class="supprimer">Supprimer</button>
      <button data-index="${index}" class="modifier">+1</button>
    `;

    panier.appendChild(li);
  });

  // Mettre à jour le total
  totalSpan.textContent = `${total.toFixed(2)} €`;

  // Écouter les clics sur les boutons "Supprimer" et "+1"
  document.querySelectorAll('.supprimer').forEach(bouton => {
    bouton.addEventListener('click', (e) => {
      const index = parseInt(e.target.getAttribute('data-index'));
      supprimerDuPanier(index);
    });
  });

  document.querySelectorAll('.modifier').forEach(bouton => {
    bouton.addEventListener('click', (e) => {
      const index = parseInt(e.target.getAttribute('data-index'));
      panierUtilisateur[index].quantity += 1;
      sauvegarderPanier();
      afficherPanier();
    });
  });
}

// Fonction pour supprimer un produit du panier
function supprimerDuPanier(index) {
  panierUtilisateur.splice(index, 1);
  sauvegarderPanier();
  afficherPanier();
}
// Initialiser l'application
window.addEventListener('DOMContentLoaded', () => {
  afficherProduits();
  chargerPanier();
});

    </script>
  </body>
</html>
