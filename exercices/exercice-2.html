<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/pico.min.css">
    <title>Exercice 2 - Préférences utilisateur</title>
  </head>
  <body>
    <main class="container">
      <h1>Exercice 2 : Gestionnaire de préférences</h1>

      <!-- Formulaire des préférences -->
      <form id="preferencesForm">
        <div>
          <label for="nom">Nom :</label>
          <input type="text" id="nom" placeholder="Votre nom">
        </div>

        <div>
          <label for="couleur">Couleur préférée :</label>
          <select id="couleur">
            <option value="bleu">Bleu</option>
            <option value="rouge">Rouge</option>
            <option value="vert">Vert</option>
            <option value="jaune">Jaune</option>
          </select>
        </div>

        <div>
          <label for="langue">Langue :</label>
          <select id="langue">
            <option value="fr">Français</option>
            <option value="en">Anglais</option>
            <option value="es">Espagnol</option>
          </select>
        </div>

        <div>
          <label>
            <input type="checkbox" id="modeSombre"> Mode sombre
          </label>
        </div>
      </form>

      <!-- Zone d'affichage des préférences -->
      <div id="affichagePreferences"></div>
    </main>

    <script>
      // Sélection des éléments du formulaire
const formPreferences = document.querySelector('#preferencesForm');
const inputNom = document.querySelector('#nom');
const selectCouleur = document.querySelector('#couleur');
const selectLangue = document.querySelector('#langue');
const checkboxModeSombre = document.querySelector('#modeSombre');
const affichagePreferences = document.querySelector('#affichagePreferences');

// Fonction pour afficher les préférences

function sauvegarderPreferences() {
  const preferences = {
    nom: inputNom.value,
    couleur: selectCouleur.value,
    langue: selectLangue.value,
    modeSombre: checkboxModeSombre.checked
  };


  // On convertit l'objet en chaîne JSON pour le localStorage
  localStorage.setItem('preferencesUtilisateur', JSON.stringify(preferences));

  // On affiche un message de confirmation
  affichagePreferences.textContent = 'Préférences sauvegardées !';
}

// Fonction pour charger les préférences
function chargerPreferences() {
  const preferencesString = localStorage.getItem('preferencesUtilisateur');

  // Si aucune préférence n'est sauvegardée, on quitte la fonction
  if (preferencesString === null) {
    affichagePreferences.textContent = 'Aucune préférence sauvegardée.';
    return;
  }

  // On convertit la chaîne JSON en objet
  const preferences = JSON.parse(preferencesString);

  // On remplit le formulaire avec les valeurs sauvegardées
  inputNom.value = preferences.nom;
  selectCouleur.value = preferences.couleur;
  selectLangue.value = preferences.langue;
  checkboxModeSombre.checked = preferences.modeSombre;

  // On affiche un message
  affichagePreferences.textContent = 'Préférences chargées !';
}

// Écouteurs d'événements pour sauvegarder automatiquement
inputNom.addEventListener('change', sauvegarderPreferences);
selectCouleur.addEventListener('change', sauvegarderPreferences);
selectLangue.addEventListener('change', sauvegarderPreferences);
checkboxModeSombre.addEventListener('change', sauvegarderPreferences);

// Charger les préférences au démarrage de la page
chargerPreferences();

    </script>
  </body>
</html>
