<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/pico.min.css">
    <title>Exercice 1</title>
  </head>
  <body>
    <main class="container">

      <!--
        📝 EXERCICE 1 : Premiers pas avec localStorage
        
        OBJECTIF : Comprendre les opérations de base du localStorage

        
        CONCEPTS UTILES :
        - localStorage.setItem(key, value) : Sauvegarder une valeur
        - localStorage.getItem(key) : Récupérer une valeur
        - localStorage.removeItem(key) : Supprimer une valeur
        - querySelector() : Sélectionner des éléments HTML
        - addEventListener() : Gérer les événements
        - .value : Accéder à la valeur d'un champ
        - .textContent : Modifier le contenu d'un élément
        
        BONNES PRATIQUES :
        - Toujours vérifier si une valeur existe avant de l'utiliser
        - Donner des noms clairs aux clés localStorage
        - Gérer les cas d'erreur (valeurs null, undefined)
        - Commenter son code pour expliquer chaque étape
      -->

      <h1>Exercice 1</h1>

      <!-- TODO: Créer l'interface utilisateur ici -->
      <!-- Champ texte pour saisir une valeur -->
      <div>
        <label for="valeur">Valeur à sauvegarder :</label>
        <input type="text" id="valeur" placeholder="Entrez une valeur...">
      </div>

<!-- Boutons d'action -->
<div>
  <button id="sauvegarder">Sauvegarder</button>
  <button id="charger">Charger</button>
  <button id="effacer">Effacer</button>
</div>

<!-- Élément pour afficher la valeur -->
<div id="affichage"></div>
-- - Champ texte pour saisir une valeur -->
      <!-- - Bouton "Sauvegarder" -->
      <!-- - Bouton "Charger" -->
      <!-- - Bouton "Effacer" -->
      <!-- - Élément pour afficher la valeur -->

    </main>

    <script>
      // Sélection des éléments
      const inputValeur = document.querySelector('#valeur');
      const boutonSauvegarder = document.querySelector('#sauvegarder');
      const boutonCharger = document.querySelector('#charger');
      const boutonEffacer = document.querySelector('#effacer');
      const affichage = document.querySelector('#affichage');

      // Sauvegarde de la valeur
      boutonSauvegarder.addEventListener('click', function() {
        const valeur = inputValeur.value;
        if (valeur.trim() === '') {
          affichage.textContent = 'Veuillez entrer une valeur.';
          return;
        }
        localStorage.setItem('maValeur', valeur);
        affichage.textContent = `Valeur "${valeur}" sauvegardée !`;
      });

      // Chargement de la valeur
      boutonCharger.addEventListener('click', function() {
        const valeur = localStorage.getItem('maValeur');
        if (valeur === null) {
          affichage.textContent = 'Aucune valeur sauvegardée.';
          return;
        }
        inputValeur.value = valeur;
        affichage.textContent = `Valeur "${valeur}" chargée !`;
      });

      // Effacement de la valeur
      boutonEffacer.addEventListener('click', function() {
        localStorage.removeItem('maValeur');
        inputValeur.value = '';
        affichage.textContent = 'Valeur effacée !';
      });

    </script>
  </body>
</html>
